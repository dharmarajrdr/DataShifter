spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=execution-engine
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.datashifter.common.events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ============================================================
# Parallel chunk processing
# Set enabled=true to activate multi-threaded workers
# ============================================================
datashifter.parallel.enabled=false
datashifter.parallel.default-workers=4
datashifter.parallel.max-workers=16
datashifter.parallel.queue-capacity=8

# ============================================================
# Auto-tune chunk size per table
# Set enabled=true to let the system pick optimal chunk sizes
# ============================================================
datashifter.tuning.enabled=false
datashifter.tuning.target-chunk-memory-mb=50
datashifter.tuning.min-chunk-size=1000
datashifter.tuning.max-chunk-size=100000
datashifter.tuning.sample-rows=10

# JWT config
datashifter.jwt.secret=${DS_JWT_SECRET}
datashifter.jwt.access-token-expiry-ms=${DS_JWT_ACCESS_EXPIRY}
datashifter.jwt.refresh-token-expiry-ms=${DS_JWT_REFRESH_EXPIRY}