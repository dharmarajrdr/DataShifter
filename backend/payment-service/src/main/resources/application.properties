server.port=8087
spring.application.name=payment-service

# Database (shared with other services)
spring.datasource.url=${DS_DB_URL}
spring.datasource.username=${DS_DB_USERNAME}
spring.datasource.password=${DS_DB_PASSWORD}
spring.datasource.driver-class-name=${DS_DB_DRIVER}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=${DS_REDIS_HOST}
spring.data.redis.port=${DS_REDIS_PORT}

# Kafka
spring.kafka.bootstrap-servers=${DS_KAFKA_BOOTSTRAP}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# JWT (for auth filter)
datashifter.jwt.secret=${DS_JWT_SECRET}
datashifter.jwt.access-token-expiry-ms=${DS_JWT_ACCESS_EXPIRY:900000}
datashifter.jwt.refresh-token-expiry-ms=${DS_JWT_REFRESH_EXPIRY:604800000}

# Razorpay - https://easy.razorpay.com/onboarding/l1_milestone/basic_details_step/contact_mobile_component
datashifter.razorpay.key-id=${DS_RAZORPAY_KEY_ID}
datashifter.razorpay.key-secret=${DS_RAZORPAY_KEY_SECRET}

# Stripe
datashifter.stripe.secret-key=${DS_STRIPE_SECRET_KEY:sk_live_REPLACE_ME}
datashifter.stripe.publishable-key=${DS_STRIPE_PUBLISHABLE_KEY:pk_live_REPLACE_ME}
datashifter.stripe.webhook-secret=${DS_STRIPE_WEBHOOK_SECRET:whsec_REPLACE_ME}
