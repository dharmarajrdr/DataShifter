server.port=8089
spring.application.name=ai-service

# --- PostgreSQL ---
spring.datasource.url=${DS_DB_URL:jdbc:postgresql://localhost:5432/datashifter}
spring.datasource.driver-class-name=${DS_DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DS_DB_USERNAME:postgres}
spring.datasource.password=${DS_DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=${DS_REDIS_HOST:localhost}
spring.data.redis.port=${DS_REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# Kafka (Producer only in ai-service; disable listener auto-startup so pipeline-service handles workflow events)
spring.kafka.bootstrap-servers=${DS_KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.auto-startup=false

# JWT
datashifter.jwt.secret=${DS_JWT_SECRET:defaultSecretKeyForDevelopmentOnlyMustBeAtLeast256BitsLong123456}
datashifter.jwt.access-token-expiry-ms=${DS_JWT_ACCESS_EXPIRY:3600000}
datashifter.jwt.refresh-token-expiry-ms=${DS_JWT_REFRESH_EXPIRY:604800000}

# Beetel AI Agent Configuration
datashifter.ai.agent-name=${BEETEL_AGENT_NAME:Beetel}
datashifter.ai.groq.api-keys=${GROQ_API_KEYS:${GROQ_API_KEY:}}
datashifter.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
datashifter.ai.groq.default-model=${GROQ_MODEL:openai/gpt-oss-120b}
datashifter.ai.groq.cooldown-seconds=${GROQ_KEY_COOLDOWN_SECONDS:120}

datashifter.ai.ollama.enabled=${OLLAMA_ENABLED:true}
datashifter.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
datashifter.ai.ollama.default-model=${OLLAMA_MODEL:gemma4:12b}

# UDF Registry bean properties
datashifter.udf.storage.root=${DS_UDF_STORAGE_ROOT:/tmp/datashifter/udfs}
datashifter.udf.max-file-size-bytes=${DS_UDF_MAX_FILE_SIZE_BYTES:26214400}

# Allow bean definition overriding across imported modules
spring.main.allow-bean-definition-overriding=true

