server.port=8086
spring.application.name=auth-service

# --- PostgreSQL ---
spring.datasource.url=${DS_DB_URL}
spring.datasource.driver-class-name=${DS_DB_DRIVER}
spring.datasource.username=${DS_DB_USERNAME}
spring.datasource.password=${DS_DB_PASSWORD}
# --- Oracle ---
# spring.datasource.url=jdbc:oracle:thin:@//10.183.63.141:2126/QAMST6RH
# spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=${DS_REDIS_HOST}
spring.data.redis.port=${DS_REDIS_PORT}

# JWT
datashifter.jwt.secret=${DS_JWT_SECRET}
datashifter.jwt.access-token-expiry-ms=${DS_JWT_ACCESS_EXPIRY}
datashifter.jwt.refresh-token-expiry-ms=${DS_JWT_REFRESH_EXPIRY}
# Mail Configuration
spring.mail.host=${DS_SMTP_HOST}
spring.mail.port=${DS_SMTP_PORT}
spring.mail.username=${DS_SMTP_USERNAME}
spring.mail.password=${DS_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

