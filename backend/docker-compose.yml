version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: datashifter
      POSTGRES_PASSWORD: datashifter_password
      POSTGRES_DB: datashifter_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U datashifter -d datashifter_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: gateway-service
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DS_DB_URL: jdbc:postgresql://postgres:5432/datashifter_db
      DS_DB_DRIVER: org.postgresql.Driver
      DS_DB_USERNAME: datashifter
      DS_DB_PASSWORD: datashifter_password
      DS_REDIS_PORT: 6379
      DS_REDIS_HOST: redis
      DS_KAFKA_BOOTSTRAP: kafka:29092
      DS_JWT_SECRET: super_secret_jwt_key_that_is_at_least_256_bits_long_for_security
      DS_JWT_ACCESS_EXPIRY: 3600000
      DS_JWT_REFRESH_EXPIRY: 86400000

  connector-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: connector-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DS_DB_URL: jdbc:postgresql://postgres:5432/datashifter_db
      DS_DB_DRIVER: org.postgresql.Driver
      DS_DB_USERNAME: datashifter
      DS_DB_PASSWORD: datashifter_password
      DS_REDIS_PORT: 6379
      DS_REDIS_HOST: redis
      DS_KAFKA_BOOTSTRAP: kafka:29092
      DS_JWT_SECRET: super_secret_jwt_key_that_is_at_least_256_bits_long_for_security
      DS_JWT_ACCESS_EXPIRY: 3600000
      DS_JWT_REFRESH_EXPIRY: 86400000

  pipeline-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: pipeline-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DS_DB_URL: jdbc:postgresql://postgres:5432/datashifter_db
      DS_DB_DRIVER: org.postgresql.Driver
      DS_DB_USERNAME: datashifter
      DS_DB_PASSWORD: datashifter_password
      DS_REDIS_PORT: 6379
      DS_REDIS_HOST: redis
      DS_KAFKA_BOOTSTRAP: kafka:29092
      DS_JWT_SECRET: super_secret_jwt_key_that_is_at_least_256_bits_long_for_security
      DS_JWT_ACCESS_EXPIRY: 3600000
      DS_JWT_REFRESH_EXPIRY: 86400000

  monitor-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: monitor-service
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DS_DB_URL: jdbc:postgresql://postgres:5432/datashifter_db
      DS_DB_DRIVER: org.postgresql.Driver
      DS_DB_USERNAME: datashifter
      DS_DB_PASSWORD: datashifter_password
      DS_REDIS_PORT: 6379
      DS_REDIS_HOST: redis
      DS_KAFKA_BOOTSTRAP: kafka:29092
      DS_JWT_SECRET: super_secret_jwt_key_that_is_at_least_256_bits_long_for_security
      DS_JWT_ACCESS_EXPIRY: 3600000
      DS_JWT_REFRESH_EXPIRY: 86400000

  execution-engine:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: execution-engine
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DS_DB_URL: jdbc:postgresql://postgres:5432/datashifter_db
      DS_DB_DRIVER: org.postgresql.Driver
      DS_DB_USERNAME: datashifter
      DS_DB_PASSWORD: datashifter_password
      DS_REDIS_PORT: 6379
      DS_REDIS_HOST: redis
      DS_KAFKA_BOOTSTRAP: kafka:29092
      DS_JWT_SECRET: super_secret_jwt_key_that_is_at_least_256_bits_long_for_security
      DS_JWT_ACCESS_EXPIRY: 3600000
      DS_JWT_REFRESH_EXPIRY: 86400000

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: notification-service
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DS_DB_URL: jdbc:postgresql://postgres:5432/datashifter_db
      DS_DB_DRIVER: org.postgresql.Driver
      DS_DB_USERNAME: datashifter
      DS_DB_PASSWORD: datashifter_password
      DS_REDIS_PORT: 6379
      DS_REDIS_HOST: redis
      DS_KAFKA_BOOTSTRAP: kafka:29092
      DS_JWT_SECRET: super_secret_jwt_key_that_is_at_least_256_bits_long_for_security
      DS_JWT_ACCESS_EXPIRY: 3600000
      DS_JWT_REFRESH_EXPIRY: 86400000

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DS_DB_URL: jdbc:postgresql://postgres:5432/datashifter_db
      DS_DB_DRIVER: org.postgresql.Driver
      DS_DB_USERNAME: datashifter
      DS_DB_PASSWORD: datashifter_password
      DS_REDIS_PORT: 6379
      DS_REDIS_HOST: redis
      DS_KAFKA_BOOTSTRAP: kafka:29092
      DS_JWT_SECRET: super_secret_jwt_key_that_is_at_least_256_bits_long_for_security
      DS_JWT_ACCESS_EXPIRY: 3600000
      DS_JWT_REFRESH_EXPIRY: 86400000
      DS_SMTP_HOST: ${DS_SMTP_HOST:-localhost}
      DS_SMTP_PORT: ${DS_SMTP_PORT:-25}
      DS_SMTP_USERNAME: ${DS_SMTP_USERNAME:-}
      DS_SMTP_PASSWORD: ${DS_SMTP_PASSWORD:-}

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-service
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DS_DB_URL: jdbc:postgresql://postgres:5432/datashifter_db
      DS_DB_DRIVER: org.postgresql.Driver
      DS_DB_USERNAME: datashifter
      DS_DB_PASSWORD: datashifter_password
      DS_REDIS_PORT: 6379
      DS_REDIS_HOST: redis
      DS_KAFKA_BOOTSTRAP: kafka:29092
      DS_JWT_SECRET: super_secret_jwt_key_that_is_at_least_256_bits_long_for_security
      DS_JWT_ACCESS_EXPIRY: 3600000
      DS_JWT_REFRESH_EXPIRY: 86400000
      DS_RAZORPAY_KEY_ID: mock_razorpay_key_id
      DS_RAZORPAY_KEY_SECRET: mock_razorpay_key_secret

  udf-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: udf-service
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DS_DB_URL: jdbc:postgresql://postgres:5432/datashifter_db
      DS_DB_DRIVER: org.postgresql.Driver
      DS_DB_USERNAME: datashifter
      DS_DB_PASSWORD: datashifter_password
      DS_JWT_SECRET: super_secret_jwt_key_that_is_at_least_256_bits_long_for_security
      DS_JWT_ACCESS_EXPIRY: 3600000
      DS_JWT_REFRESH_EXPIRY: 86400000
      DS_UDF_STORAGE_ROOT: /var/lib/datashifter/udfs
      DS_UDF_MAX_FILE_SIZE_BYTES: 26214400
    volumes:
      - udfdata:/var/lib/datashifter/udfs

volumes:
  pgdata:
  udfdata:
