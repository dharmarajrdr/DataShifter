server.port=8082
spring.application.name=pipeline-service

# --- PostgreSQL ---
spring.datasource.url=${DS_DB_URL}
spring.datasource.driver-class-name=${DS_DB_DRIVER}
spring.datasource.username=${DS_DB_USERNAME}
spring.datasource.password=${DS_DB_PASSWORD}
# --- Oracle ---
# spring.datasource.url=jdbc:oracle:thin:@//10.183.63.141:2126/QAMST6RH
# spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=${DS_REDIS_HOST}
spring.data.redis.port=${DS_REDIS_PORT}

# Kafka
spring.kafka.bootstrap-servers=${DS_KAFKA_BOOTSTRAP}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# JWT
datashifter.jwt.secret=${DS_JWT_SECRET}
datashifter.jwt.access-token-expiry-ms=${DS_JWT_ACCESS_EXPIRY}
datashifter.jwt.refresh-token-expiry-ms=${DS_JWT_REFRESH_EXPIRY}

# Allow bean definition overriding to resolve conflicts between common and service-specific beans
spring.main.allow-bean-definition-overriding=true