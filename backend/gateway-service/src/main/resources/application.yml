server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: connector-service
          uri: http://connector-service:8081
          predicates:
            - Path=/api/v1/connections/**

        - id: udf-service
          uri: http://udf-service:8088
          predicates:
            - Path=/api/v1/udfs/**

        # Monitor routes — MUST be before pipeline-service
        - id: monitor-service
          uri: http://monitor-service:8083
          predicates:
            - Path=/api/v1/pipelines/*/monitor,/api/v1/pipelines/*/monitor/**,/api/v1/pipelines/*/errors,/api/v1/pipelines/*/errors/**,/api/v1/pipelines/*/executions,/api/v1/pipelines/*/executions/**

        # Mappings + Settings — route to pipeline-service
        - id: pipeline-service-sub
          uri: http://pipeline-service:8082
          predicates:
            - Path=/api/v1/pipelines/*/mappings,/api/v1/pipelines/*/mappings/**,/api/v1/pipelines/*/settings,/api/v1/pipelines/*/settings/**

        - id: pipeline-service
          uri: http://pipeline-service:8082
          predicates:
            - Path=/api/v1/pipelines/**,/api/v1/namespaces/**

        - id: auth-service
          uri: http://auth-service:8086
          predicates:
            - Path=/api/v1/auth/**

        - id: notification-service
          uri: http://notification-service:8085
          predicates:
            - Path=/api/v1/stream/**

        - id: payment-service
          uri: http://payment-service:8087
          predicates:
            - Path=/api/v1/payments/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - PreserveHostHeader

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
