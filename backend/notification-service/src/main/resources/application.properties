server.port=8085
spring.application.name=notification-service

# ============================================================
# Kafka — consumes pipeline events for real-time push
# ============================================================
spring.kafka.bootstrap-servers=${DS_KAFKA_BOOTSTRAP}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.datashifter.common.events

# ============================================================
# JWT — same secret as all other services
# ============================================================
datashifter.jwt.secret=${DS_JWT_SECRET}
datashifter.jwt.access-token-expiry-ms=${DS_JWT_ACCESS_EXPIRY}
datashifter.jwt.refresh-token-expiry-ms=${DS_JWT_REFRESH_EXPIRY}

# ============================================================
# SSE configuration
# ============================================================
# Timeout for idle SSE connections (ms). 0 = no timeout.
datashifter.sse.timeout-ms=0
# Heartbeat interval to keep connections alive through proxies (ms)
datashifter.sse.heartbeat-interval-ms=15000
# Max concurrent SSE connections per user
datashifter.sse.max-connections-per-user=10

# ============================================================
# PostgreSQL / JPA for NotifyHub (Channels, Templates, Logs)
# ============================================================
spring.datasource.url=${DS_DB_URL:jdbc:postgresql://localhost:5432/datashifter}
spring.datasource.username=${DS_DB_USERNAME:postgres}
spring.datasource.password=${DS_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DS_DB_DRIVER:org.postgresql.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================================
# NotifyHub Retry Settings
# ============================================================
notifyhub.retry.max-attempts=3
notifyhub.retry.initial-interval-ms=1000
notifyhub.retry.multiplier=2.0
notifyhub.retry.max-interval-ms=10000
